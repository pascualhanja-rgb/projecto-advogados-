<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Fundo: profundidade Slate premium -->
    <radialGradient id="bg" cx="0.5" cy="0.22" r="1.05">
      <stop offset="0" stop-color="#243349"/>
      <stop offset="0.55" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </radialGradient>
    <!-- Dourado Amber da marca -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="0.45" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <!-- Brilho suave (glow) atrás do emblema -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Telha do app -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <!-- Linha de glow na borda superior -->
  <rect x="1" y="1" width="510" height="510" rx="117" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <path d="M118 2 h276 a116 116 0 0 1 116 116 v6 H2 v-6 A116 116 0 0 1 118 2 Z" fill="rgba(255,255,255,0.045)"/>

  <!-- Glow de fundo -->
  <circle cx="256" cy="252" r="180" fill="url(#glow)"/>

  <!-- Emblema: balança da justiça -->
  <g filter="url(#softShadow)">
    <g stroke="url(#goldStroke)" stroke-width="24" stroke-linecap="round" fill="none">
      <!-- coluna central -->
      <line x1="256" y1="128" x2="256" y2="352"/>
      <!-- travessa -->
      <line x1="122" y1="176" x2="390" y2="176"/>
      <!-- fios dos pratos -->
      <path d="M122 176 L76 288"/>
      <path d="M122 176 L168 288"/>
      <path d="M390 176 L344 288"/>
      <path d="M390 176 L436 288"/>
      <!-- arcos dos pratos -->
      <path d="M76 288 A46 46 0 0 0 168 288"/>
      <path d="M344 288 A46 46 0 0 0 436 288"/>
    </g>
    <!-- esfera do topo -->
    <circle cx="256" cy="114" r="25" fill="url(#gold)"/>
    <!-- base -->
    <rect x="178" y="352" width="156" height="26" rx="13" fill="url(#gold)"/>
    <!-- pedestal -->
    <rect x="212" y="384" width="88" height="16" rx="8" fill="#D97706" opacity="0.9"/>
  </g>

  <!-- Detalhe: pino de localização discreto (conexão cliente-advogado) -->
  <g transform="translate(392 392) scale(0.9)">
    <path d="M12 22s7-7.1 7-12a7 7 0 1 0-14 0c0 4.9 7 12 7 12Z" fill="#10B981" stroke="#0F172A" stroke-width="1.8"/>
    <circle cx="12" cy="10" r="2.6" fill="#0F172A"/>
  </g>
</svg>
